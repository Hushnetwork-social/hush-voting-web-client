[package]
name = "hush-voting-app"
version = "0.1.0"
description = "HushVoting web, Ubuntu desktop, and Android client"
authors = ["HushNetwork"]
license = "MIT"
repository = "https://github.com/Hushnetwork-social/hush-voting-web-client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hush_voting_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["image-png"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
