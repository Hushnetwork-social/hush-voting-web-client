[package]
name = "hush-voting-app"
version = "0.1.0"
description = "HushVoting web, Ubuntu desktop, and Android client"
authors = ["HushNetwork"]
license = "MIT"
repository = "https://github.com/Hushnetwork-social/hush-voting-web-client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hush_voting_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
tonic-build = "=0.13.1"
prost-build = "=0.13.5"
sha2 = "=0.10.8"

[dependencies]
tauri = { version = "2.11.2", features = ["image-png"] }
serde = { version = "=1.0.220", features = ["derive"] }
serde_json = "=1.0.140"
# FEAT-005 Phase 3 exact pins (planning-analysis-report.md §11 pin ledger;
# every pin MSRV <= Rust 1.77.2).
oo7 = { version = "=0.3.3", default-features = false, features = ["tokio", "native_crypto"] }
argon2 = "=0.5.3"
hkdf = "=0.12.4"
sha2 = "=0.10.8"
aes-gcm = "=0.10.3"
zeroize = { version = "=1.8.1", features = ["derive"] }
secrecy = "=0.10.3"
getrandom = "=0.2.15"
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros", "net", "time"] }
fd-lock = "=4.0.4"
# Best-effort memory-lock / O_NOFOLLOW / core-dump hardening (sanitized
# capability diagnostics only; MSRV 1.63 <= 1.77.2).
libc = "=0.2.189"
# FEAT-005 Phase 4 exact pins (planning-analysis-report.md §11 pin ledger;
# every pin MSRV <= Rust 1.77.2).
# gRPC transport generated from the digest-pinned HushServerNode protocol
# artifacts (see build.rs digest gate).
tonic = { version = "=0.13.1", default-features = false, features = ["channel", "transport", "tls-native-roots"] }
prost = "=0.13.5"
# secp256k1 ECDSA (RFC 6979 deterministic) for operation-scoped
# CreateFullIdentity signing; replays FEAT-001 signature vectors.
k256 = { version = "=0.13.4", features = ["ecdsa", "sha256"] }
# Single-instance per Ubuntu user session (exact-pinned reviewed integration).
tauri-plugin-single-instance = "=2.4.3"

[dev-dependencies]
rand = "=0.8.5"
