name: CI - HushVoting Client

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  HUSH_CI_E2E_DOTNET_FILTER: "Category=E2E&Category=HappyPath&Category!=LONG_RUNNING"
  HUSH_CI_GHERKIN_TAG_EXPRESSION: "@HappyPath and not @LONG_RUNNING"

jobs:
  frontend:
    name: Web and static client gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Next.js compilation
        uses: actions/cache@v6
        with:
          path: .next-web/cache
          key: next-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tailwind.config.ts') }}
          restore-keys: |
            next-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-
            next-v1-${{ runner.os }}-node22-

      - name: Run frontend CI contract
        shell: bash
        run: bash scripts/ci/run-frontend-ci.sh

  rust-contract:
    name: Tauri Rust contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Validate Cargo metadata
        working-directory: src-tauri
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
