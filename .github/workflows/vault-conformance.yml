name: Vault Conformance - FEAT-003

# FEAT-003 Phase 6 (Task 6.1): unified vault conformance CI.
# When vault contract artifacts change (schemas, vectors, manifest, core,
# conformance tooling, or scripts), this workflow runs the complete vault gate
# contract through `scripts/vault/ci-vault.mjs`:
#   lint, typecheck, unit tests, corpus integrity, corpus node:test suites,
#   primary + isolated TypeScript/Node conformance, FEAT-001 identity regression,
#   web + static builds, auth artifact audit, and production-exclusion scans.
# Prior retained corpus versions replay via `scripts/vault/replay-prior-versions.mjs`
# against their immutable manifest digest pins.
# Revisions and digests are recorded in the job summary; no credential values are
# ever emitted in logs or reports.

on:
  pull_request:
    branches: [main]
    paths:
      - "conformance/vault/**"
      - "src/lib/vault-core/**"
      - "scripts/vault/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "conformance/vault/**"
      - "src/lib/vault-core/**"
      - "scripts/vault/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  vault-conformance:
    name: Unified vault gate contract
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unified vault CI contract
        id: vault-ci
        shell: bash
        run: |
          set -euo pipefail
          node scripts/vault/ci-vault.mjs
          echo "manifest-digest=$(node -e "console.log(JSON.parse(require('fs').readFileSync('conformance/reports/vault-ci-summary.json','utf8')).manifestSha256)")" >> "${GITHUB_OUTPUT}"
          echo "revision=$(node -e "console.log(JSON.parse(require('fs').readFileSync('conformance/reports/vault-ci-summary.json','utf8')).revision)")" >> "${GITHUB_OUTPUT}"

      - name: Replay retained prior corpus versions
        run: node scripts/vault/replay-prior-versions.mjs

      - name: Record revisions and digest
        shell: bash
        run: |
          {
            echo "## Vault Conformance (FEAT-003)"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Revision | \`${{ steps.vault-ci.outputs.revision }}\` |"
            echo "| Manifest digest | \`${{ steps.vault-ci.outputs.manifest-digest }}\` |"
            echo "| Corpus version | \`1.0.0\` |"
            echo "| Result | all gates passed (exit 0) |"
            echo ""
            echo "No credential values are emitted in logs or reports."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload isolated report
        uses: actions/upload-artifact@v4
        with:
          name: vault-ts-isolated-report
          path: conformance/reports/vault-ts-isolated.json
          if-no-files-found: error

      - name: Upload primary report
        uses: actions/upload-artifact@v4
        with:
          name: vault-ts-reference-report
          path: conformance/reports/vault-ts-reference.json
          if-no-files-found: error

      - name: Upload CI summary
        uses: actions/upload-artifact@v4
        with:
          name: vault-ci-summary
          path: conformance/reports/vault-ci-summary.json
          if-no-files-found: error
